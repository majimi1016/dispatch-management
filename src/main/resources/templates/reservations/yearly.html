<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>合材予約の年別まとめ</title>
    <style>
        .nav-row { display: flex; gap: 12px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
        table.summary { border-collapse: collapse; font-size: 14px; margin-top: 8px; }
        table.summary th, table.summary td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: right;
            white-space: nowrap;
        }
        table.summary th { background: #f3f4f6; text-align: center; }
        table.summary td.month { text-align: left; }
        table.summary td.total { background: #f9fafb; font-weight: bold; }
        table.summary tfoot td { background: #eef2ff; font-weight: bold; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/menu :: menu}"></nav>

<h1>合材予約の年別まとめ</h1>

<!-- 年の切り替え -->
<div class="nav-row">
    <a th:href="@{/reservations/yearly(year=${year - 1})}">◀ 前の年</a>
    <strong th:text="|${year}年(引取済みの数量・単位t)|"></strong>
    <a th:href="@{/reservations/yearly(year=${year + 1})}">次の年 ▶</a>
    <a th:href="@{/reservations/yearly}">今年</a>
</div>

<p th:if="${#lists.isEmpty(summary.items)}">この年に引取済みの予約はありません</p>

<table class="summary" th:unless="${#lists.isEmpty(summary.items)}">
    <thead>
    <tr>
        <th>月</th>
        <th th:each="item : ${summary.items}" th:text="${item.name}"></th>
        <th>合計</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="m : ${summary.rows}">
        <!-- 月の名前を押すと、その月の月別まとめへ -->
        <td class="month">
            <a th:href="@{/reservations/monthly(ym=${year + '-' + #numbers.formatInteger(m, 2)})}"
               th:text="|${m}月|"></a>
        </td>
        <td th:each="item : ${summary.items}"
            th:with="n=${summary.value(m, item)}"
            th:text="${n.signum() == 0 ? '' : #numbers.formatDecimal(n, 1, 'COMMA', 1, 'POINT')}"></td>
        <td class="total"
            th:with="n=${summary.rowTotal(m)}"
            th:text="${n.signum() == 0 ? '' : #numbers.formatDecimal(n, 1, 'COMMA', 1, 'POINT')}"></td>
    </tr>
    </tbody>

    <tfoot>
    <tr>
        <td class="month">合計</td>
        <td th:each="item : ${summary.items}"
            th:text="${#numbers.formatDecimal(summary.itemTotal(item), 1, 'COMMA', 1, 'POINT')}"></td>
        <td th:text="${#numbers.formatDecimal(summary.grandTotal(), 1, 'COMMA', 1, 'POINT')}"></td>
    </tr>
    </tfoot>
</table>

</body>
</html>
