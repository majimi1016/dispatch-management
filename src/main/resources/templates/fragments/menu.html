<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="menu" class="menu">
    <style>
        .menu {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 10px 16px;
            background: #f3f4f6;
            border-bottom: 1px solid #ddd;
            margin-bottom: 16px;
        }
        .menu a { text-decoration: none; color: #1f2937; }
        .menu a:hover { text-decoration: underline; }
        .dropdown { position: relative; }
        .dropdown summary { cursor: pointer; list-style: none; }
        .dropdown summary::-webkit-details-marker { display: none; }
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 6px;
            background: #fff;
            border: 1px solid #ddd;
            min-width: 140px;
            z-index: 10;
        }
        .dropdown-list a { display: block; padding: 8px 12px; }
        .dropdown-list a:hover { background: #f3f4f6; text-decoration: none; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .sat { color: #1d4ed8; }   /* ← 追加:土曜日は青 */
        .sun { color: #dc2626; }   /* ← 追加:日曜日は赤 */
    </style>

    <a th:href="@{/dispatches}">配達一覧</a>
    <a th:href="@{/dispatches/new}">配達入力</a>

    <details class="dropdown">
        <summary>合材予約 ▼</summary>
        <div class="dropdown-list">
            <a th:href="@{/reservations}">予約一覧</a>
            <a th:href="@{/reservations/new}">予約入力</a>
        </div>
    </details>

    <details class="dropdown">
        <summary>登録 ▼</summary>
        <div class="dropdown-list">
            <a th:href="@{/companies}">会社の登録</a>
            <a th:href="@{/items}">品目の登録</a>
        </div>
    </details>

    <script>
        // 登録ボタンの二重押しを防ぐ(全画面共通)
        document.addEventListener('submit', function (e) {
            const form = e.target;

            // 確認ダイアログで「キャンセル」を押したときなど、送信が止められたら何もしない
            if (e.defaultPrevented) return;

            // 日付の切り替え(GET)は対象外。登録(POST)だけ
            if (form.method.toLowerCase() !== 'post') return;

            // すでに送信中なら、2回目の送信を止める
            if (form.dataset.submitting === 'true') {
                e.preventDefault();
                return;
            }
            form.dataset.submitting = 'true';

            // 送信ボタンを押せなくして、文字を「登録中...」に変える
            form.querySelectorAll('button[type="submit"], button:not([type])').forEach(function (btn) {
                btn.dataset.originalText = btn.textContent;
                btn.textContent = '登録中...';
                btn.disabled = true;
            });
        });

        // ブラウザの「戻る」で戻ってきたときは、ボタンを元に戻す
        window.addEventListener('pageshow', function () {
            document.querySelectorAll('form').forEach(function (form) {
                form.dataset.submitting = 'false';
            });
            document.querySelectorAll('button[data-original-text]').forEach(function (btn) {
                btn.textContent = btn.dataset.originalText;
                btn.disabled = false;
            });
        });
    </script>
</nav>

</body>
</html>
