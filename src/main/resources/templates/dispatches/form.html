<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>配車登録</title>
</head>
<body>
<h1>配車登録</h1>

<form th:action="@{/dispatches}" th:object="${dispatch}" method="post">
    <div>
        <label>配車日</label>
        <input type="date" th:field="*{dispatchDate}">
        <span th:if="${#fields.hasErrors('dispatchDate')}" th:errors="*{dispatchDate}" style="color:red"></span>
    </div>

    <!-- ↓ 追加:会社 -->
    <div>
        <label>会社</label>
        <select th:field="*{company}">
            <option value="">選んでください</option>
            <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <a th:href="@{/companies}">会社がない場合はこちらから登録</a>
        <span th:if="${#fields.hasErrors('company')}" th:errors="*{company}" style="color:red"></span>
    </div>

    <!-- ↓ 追加:車格 -->
    <div>
        <label>車格</label>
        <select th:field="*{vehicleSize}">
            <option value="">選んでください</option>
            <option th:each="s : ${vehicleSizes}" th:value="${s}" th:text="${s.label}"></option>
        </select>
        <span th:if="${#fields.hasErrors('vehicleSize')}" th:errors="*{vehicleSize}" style="color:red"></span>
    </div>

    <div>
        <label>車両番号</label>
        <input type="text" th:field="*{vehicleNo}">
        <span th:if="${#fields.hasErrors('vehicleNo')}" th:errors="*{vehicleNo}" style="color:red"></span>
    </div>
    <div>
        <label>ドライバー</label>
        <input type="text" th:field="*{driverName}">
        <span th:if="${#fields.hasErrors('driverName')}" th:errors="*{driverName}" style="color:red"></span>
    </div>
    <div>
        <label>配送先</label>
        <input type="text" th:field="*{destination}">
        <span th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}" style="color:red"></span>
    </div>
    <div>
        <label>台数</label>
        <input type="number" th:field="*{quantity}" min="1">
        <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" style="color:red"></span>
    </div>
    <div>
        <label>備考</label>
        <input type="text" th:field="*{remarks}">
    </div>
    <button type="submit">登録</button>
</form>

<a th:href="@{/dispatches}">一覧に戻る</a>
</body>
</html>
