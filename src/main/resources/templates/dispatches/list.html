<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>配車一覧</title>
</head>
<body>

<nav>
    <a th:href="@{/dispatches}">配車一覧</a> |
    <a th:href="@{/dispatches/new}">配車登録</a> |
    <a th:href="@{/companies}">会社の登録</a>
</nav>

<h1>配車一覧</h1>

<a th:href="@{/dispatches/new}">新規登録</a>

<table border="1">
    <thead>
    <tr>
        <th>配車日</th>
        <th>昼/夜</th>  <!-- ← 追加 -->
        <th>会社</th>
        <th>車格</th>
        <th>車両番号</th>
        <th>ドライバー</th>
        <th>配送先</th>
        <th>台数</th>
        <th>備考</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${dispatches}">
        <td th:text="${d.dispatchDate}"></td>
        <td th:text="${d.shift?.label}"></td>  <!-- ← 追加 -->
        <td th:text="${d.company?.name}"></td>
        <td th:text="${d.vehicleSize?.label}"></td>
        <td th:text="${d.vehicleNo}"></td>
        <td th:text="${d.driverName}"></td>
        <td th:text="${d.destination}"></td>
        <td th:text="${d.quantity}"></td>
        <td th:text="${d.remarks}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(dispatches)}">
        <td colspan="9">配車データがありません</td>  <!-- ← 8から9に変更 -->
    </tr>
    </tbody>
</table>

</body>
</html>
