<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>配車一覧</title>
</head>
<body>
<h1>配車一覧</h1>

<a th:href="@{/dispatches/new}">新規登録</a>

<table border="1">
    <thead>
    <tr>
        <th>配車日</th>
        <th>車両番号</th>
        <th>ドライバー</th>
        <th>配送先</th>
        <th>数量</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${dispatches}">
        <td th:text="${d.dispatchDate}"></td>
        <td th:text="${d.vehicleNo}"></td>
        <td th:text="${d.driverName}"></td>
        <td th:text="${d.destination}"></td>
        <td th:text="${d.quantity}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(dispatches)}">
        <td colspan="5">配車データがありません</td>
    </tr>
    </tbody>
</table>
</body>
</html>
